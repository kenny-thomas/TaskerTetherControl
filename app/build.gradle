apply plugin: 'com.android.application'

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
def signingPath = System.getenv('APK_SIGNING_STORE_FILE')
def signingPassword = System.getenv('APK_KEYSTORE_PASSWORD')
def signingAlias = System.getenv('APK_KEY_ALIAS')
def signingKeyPassword = System.getenv('APK_KEY_PASSWORD')
def hasCiSigner = signingPath && signingPassword && signingAlias && signingKeyPassword

android {
    namespace 'com.matejdro.taskertethercontrol'
    compileSdk 35
    defaultConfig {
        applicationId 'com.matejdro.taskertethercontrol'
        minSdk 25
        // Keep the legacy runtime compatibility behavior until source is updated.
        targetSdk 25
        versionCode 7000 + buildNumber
        versionName '1.4.' + buildNumber
    }
    signingConfigs {
        if (hasCiSigner) {
            ciDevelopment {
                storeFile file(signingPath)
                storePassword signingPassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            if (hasCiSigner) {
                signingConfig signingConfigs.ciDevelopment
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'
}
